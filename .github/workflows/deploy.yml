# main に push されたら、チェックしてからビルドし、GitHub Pages に配信する。
# 配信されるのは dist/（アプリ本体とデモ教材の zip）だけ。デモ教材のほかに教材はリポジトリに含まれない（docs/RULES.md 3 章・11 章）。
# npm run build の最後に、配信物に入る教材がデモ教材の zip だけであることを確かめる（scripts/build/check-dist.mjs）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 配信を途中で止めないよう、実行中のものは取り消さずに順番に処理する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 配信に必要な権限は、このジョブにだけ与える
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
